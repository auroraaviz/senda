services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: senda
      MYSQL_ROOT_PASSWORD: senda-local
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./BACKEND
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: senda
      DB_USER: root
      DB_PASSWORD: senda-local
      DB_SSL_MODE: REQUIRED
      JWT_SECRET: clave-solo-para-desarrollo-local-de-mas-de-32-caracteres
      COOKIE_SECURE: "false"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./FRONTEND
      args:
        BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "3000:3000"

volumes:
  db-data:
