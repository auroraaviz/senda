spring.application.name=organizador_proyectos

spring.datasource.url=jdbc:mysql://localhost:3306/organizador_proyectos
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

//clave para firmar tokens -debe tener al menos 32 caracteres y se genera de forma random
jwt.secret=cambia-esto-por-una-clave-larga-y-aleatoria-de-al-menos-32-caracteres

//dura 24 horas
jwt.expiration-ms=86400000

