spring.application.name=organizador_proyectos

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:organizador_proyectos}?ssl-mode=${DB_SSL_MODE:DISABLED}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# clave para firmar tokens - debe tener al menos 32 caracteres
jwt.secret=${JWT_SECRET:cambia-esto-por-una-clave-larga-y-aleatoria-de-al-menos-32-caracteres}

# dura 24 horas
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.port=${PORT:8080}

cookie.secure=${COOKIE_SECURE:false}